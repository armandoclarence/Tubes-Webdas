<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫禁城 | The Forbidden City</title>
    <meta name="description" content="Explore the Forbidden City — 600 years of Chinese imperial history, sacred architecture, grand festivals, and dynastic culture.">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>

    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"></noscript>

    <link rel="preload" href="css/global.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/navbar.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/home.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/history.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/editorial.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/enhancements.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="css/faq.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/home.css">
        <link rel="stylesheet" href="css/history.css">
        <link rel="stylesheet" href="css/editorial.css">
        <link rel="stylesheet" href="css/enhancements.css">
        <link rel="stylesheet" href="css/faq.css">
    </noscript>

    <script src="js/routes.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/animations.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="loading-screen" class="loading-overlay" role="status" aria-label="Loading">
        <div class="loading-box text-center">
            <div class="spinner-border text-warning mb-3"></div>
            <h2 class="font-script text-white fs-3">Loading Imperial Palace...</h2>
        </div>
    </div>

    <div id="navbar-placeholder"></div>

    <main id="content-view" class="flex-grow-1"></main>

    <div id="footer-placeholder"></div>

    <div class="modal fade" id="imageZoomModal" tabindex="-1" aria-labelledby="imageZoomLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-0">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-2 text-center">
                    <img id="zoomedImg" src="" alt="Zoomed view" class="img-fluid rounded" style="max-height:80vh;object-fit:contain;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous" defer></script>
    <script src="js/enhancements.js" defer></script>
    <script src="js/faq.js" defer></script>
    <script src="js/router.js" defer></script>
</body>
</html>
